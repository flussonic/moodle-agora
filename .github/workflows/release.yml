# Tag validation and GitHub Release publication with the plugin ZIP.
# Lives in mod_agora/.github/workflows/ so that a snapshot sync puts it at
# the root of the GitHub repository. It is excluded from the ZIP itself
# (the build step below excludes .git*/.github).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate version.php against the tag
        run: |
          set -euo pipefail
          VERSION=$(sed -nE 's/^\$plugin->version *= *([0-9]+);.*/\1/p' version.php)
          MATURITY=$(grep -oE 'MATURITY_[A-Z]+' version.php | head -1)
          RELEASE=$(sed -nE "s/^\\\$plugin->release *= *'([^']+)'.*/\1/p" version.php)
          echo "tag: ${GITHUB_REF_NAME}, version.php: version=${VERSION} release='${RELEASE}' maturity=${MATURITY}"
          [ "$MATURITY" != "MATURITY_ALPHA" ] || { echo "ALPHA maturity in a release tag"; exit 1; }
          BUILD_DATE=${VERSION:0:8}
          grep -qF "(Build: ${BUILD_DATE})" <<<"$RELEASE" \
            || { echo "the Build date in release does not match the version date"; exit 1; }
          case "$GITHUB_REF_NAME" in
            *-rc.*)
              grep -qF "rc." <<<"$RELEASE" || { echo "rc tag, but release has no rc"; exit 1; } ;;
            *)
              if grep -qF "rc." <<<"$RELEASE"; then
                echo "stable tag, but release has rc"; exit 1
              fi ;;
          esac
          echo "version.php matches the tag"

      - name: Build the plugin ZIP
        run: |
          set -euo pipefail
          mkdir -p stage/agora
          rsync -a \
            --exclude='lang/ru' \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='.scratchpad' \
            --exclude='*.orig' \
            --exclude='*.rej' \
            --exclude='.phpunit.result.cache' \
            ./ stage/agora/
          (cd stage && zip -qr "$GITHUB_WORKSPACE/agora.zip" agora)

      - name: Publish the GitHub Release
        run: |
          set -euo pipefail
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-rc.*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" agora.zip \
            --title "$GITHUB_REF_NAME" --generate-notes $PRERELEASE
        env:
          GH_TOKEN: ${{ github.token }}
